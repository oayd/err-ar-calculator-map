name: Build and Release ERR AR Calculator

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build standalone executable
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name ERR_AR_Calculator `
            --icon "err_icon.ico" `
            --add-data "err_weapon_data.json.gz;." `
            --add-data "err_map_data.json.gz;." `
            --add-data "err_buff_icons.json.gz;." `
            --add-data "err_icon.ico;." `
            --add-data "ui;ui" `
            --collect-all clr_loader `
            --collect-all pythonnet `
            --collect-all texture2ddecoder `
            --collect-all zstandard `
            err_ar_calculator.py

      - name: Run WebView2 self-test
        shell: powershell
        run: |
          $rep = Join-Path $env:TEMP 'ci_selftest_report.txt'
          if (Test-Path $rep) { Remove-Item -Force $rep }
          $p = Start-Process -FilePath 'dist\ERR_AR_Calculator.exe' -ArgumentList '--self-test', $rep -PassThru
          if (-not $p.WaitForExit(180000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $rep) { Get-Content $rep }
            Write-Error 'Self-test timed out after 180 seconds'
            exit 1
          }
          if (Test-Path $rep) { Get-Content $rep }
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Upload unsigned executable artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: dist/ERR_AR_Calculator.exe

      - name: Submit signing request to SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'err-ar-calculator' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Prepare release assets
        id: prep
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release_assets | Out-Null
          if (Test-Path 'signed\ERR_AR_Calculator.exe') {
            Copy-Item -Force 'signed\ERR_AR_Calculator.exe' 'release_assets\ERR_AR_Calculator.exe'
          } else {
            Copy-Item -Force 'dist\ERR_AR_Calculator.exe' 'release_assets\ERR_AR_Calculator.exe'
          }
          $hash = (Get-FileHash 'release_assets\ERR_AR_Calculator.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ERR_AR_Calculator.exe" | Set-Content -Encoding ascii 'release_assets\SHA256SUMS.txt'
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $relName = if ($env:GITHUB_REF_NAME -eq 'v2.1.3') { 'v2.1.3: 1-Click Auto-Updater' } elseif ($env:GITHUB_REF_NAME -eq 'v2.1.2') { 'v2.1.2: Smithing Stones & Somber Stones on World Map' } elseif ($env:GITHUB_REF_NAME -eq 'v2.1.1') { 'v2.1.1: Authentic Elden Ring Player Map Icon' } elseif ($env:GITHUB_REF_NAME -eq 'v2.1.0') { 'v2.1.0: Boss Resistances, Live AR, Overlay & QoL Update' } elseif ($env:GITHUB_REF_NAME -eq 'v2.0.0') { 'v2.0.0: UI Update' } else { $env:GITHUB_REF_NAME }
          "release_name=$relName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.prep.outputs.release_name }}
          files: |
            release_assets/ERR_AR_Calculator.exe
            release_assets/SHA256SUMS.txt
            docs/ERR_AR_Calculator_Quick_Start_Guide.pdf
            docs/ERR_AR_Calculator_Complete_User_Guide.pdf
          body: |
            Standalone Windows executable for **ELDEN RING Reforged (ERR v2.3.10.1)**.

            - **SHA-256 (`ERR_AR_Calculator.exe`):** `${{ steps.prep.outputs.sha256 }}`
            - **VirusTotal Scan:** [View report](https://www.virustotal.com/gui/file/${{ steps.prep.outputs.sha256 }})

            Free code signing provided by [SignPath.io](https://signpath.io/), certificate by [SignPath Foundation](https://signpath.org/). See the [Code Signing Policy](https://github.com/oayd/err-ar-calculator-map#code-signing-policy) and [Privacy Policy](https://github.com/oayd/err-ar-calculator-map#privacy-policy).
          generate_release_notes: true
