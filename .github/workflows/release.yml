name: Build and Release ERR AR Calculator

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build standalone executable
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name ERR_AR_Calculator `
            --icon "err_icon.ico" `
            --add-data "err_weapon_data.json.gz;." `
            --add-data "err_icon.ico;." `
            --add-data "ui;ui" `
            --collect-all clr_loader `
            --collect-all pythonnet `
            err_ar_calculator.py

      - name: Run WebView2 self-test
        shell: powershell
        run: |
          $rep = Join-Path $env:TEMP 'ci_selftest_report.txt'
          $p = Start-Process -FilePath 'dist\ERR_AR_Calculator.exe' -ArgumentList '--self-test', $rep -PassThru -Wait
          if (Test-Path $rep) { Get-Content $rep }
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Upload unsigned executable artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: dist/ERR_AR_Calculator.exe

      - name: Submit signing request to SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'err-ar-calculator' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Prepare release assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release_assets | Out-Null
          if (Test-Path 'signed\ERR_AR_Calculator.exe') {
            Copy-Item -Force 'signed\ERR_AR_Calculator.exe' 'release_assets\ERR_AR_Calculator.exe'
          } else {
            Copy-Item -Force 'dist\ERR_AR_Calculator.exe' 'release_assets\ERR_AR_Calculator.exe'
          }
          $hash = (Get-FileHash 'release_assets\ERR_AR_Calculator.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ERR_AR_Calculator.exe" | Set-Content -Encoding ascii 'release_assets\SHA256SUMS.txt'

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/ERR_AR_Calculator.exe
            release_assets/SHA256SUMS.txt
          generate_release_notes: true
